name: Docs

# docs.truo.cloud. Static, no backend: docs that need their own server can go
# down in the very incident they document.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "packages/openapi/openapi/v1.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "packages/openapi/openapi/v1.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  # No cancellation: two back-to-back merges to main should not leave the
  # first one's docs published.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      # The docs live outside the `packages/*` workspace precisely to keep
      # Astro out of "clone and run without installing anything". That's why
      # they install separately.
      - run: bun install
        working-directory: docs

      # `generate.ts` copies the spec and writes the reference pages. It runs
      # as part of `build` too, but it's invoked separately so a generator
      # failure is distinguishable from an Astro failure.
      - run: bun scripts/generate.ts
        working-directory: docs

      - run: bunx astro build
        working-directory: docs

      - name: Agent artifacts exist and are not empty
        run: |
          for f in openapi.json llms.txt llms-full.txt; do
            test -s "docs/dist/$f" || { echo "missing or empty: $f"; exit 1; }
          done
          grep -q '"openapi"' docs/dist/openapi.json

      # The four surfaces (curl/CLI/SDK/MCP) are the entire argument of the
      # reference, and their failure mode is silent: in plain Markdown the
      # `import` renders as text and the `<Tabs>` end up as inert HTML the
      # browser ignores. The page responds 200 and shows nothing. It happened
      # once already; that's why we check the built HTML, not that the file
      # exists.
      - name: Reference tabs actually rendered
        run: |
          page=docs/dist/reference/vps/index.html
          test -f "$page" || { echo "$page was not built"; exit 1; }
          grep -q "starlight-tabs" "$page" || { echo "the tabs did not render"; exit 1; }
          if grep -q 'import {' "$page"; then
            echo "the import came out as text: the page was not processed as MDX"; exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
