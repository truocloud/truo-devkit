name: Release

# Triggered by a `vX.Y.Z` tag. The tag is the single source of the version: the
# workflow writes it into the three package.json files before publishing, so there
# is no way to tag `v0.3.0` and publish `0.2.9` because of a forgotten commit.
on:
  push:
    tags: ["v*"]
  # Dry run without publishing: runs everything except `npm publish` and `gh release`.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse (without publishing), e.g. 0.2.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - run: bun install --frozen-lockfile

      - id: version
        run: |
          RAW="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=${RAW#v}" >> "$GITHUB_OUTPUT"

      - name: Pin the version across the three packages
        run: bun run version:set "${{ steps.version.outputs.version }}"

      # The same gates as on every push. A release is NOT the place to relax
      # them: it is exactly the moment an out-of-sync spec becomes a published
      # package that lies about the API.
      - run: bun run sync:spec --check
      - run: bun run gen:check
      - run: bun run typecheck
      # `bun run test`, not `bun test`: the script scopes the run to packages/,
      # and a bare `bun test` also walks img/ — a separate workspace with its own
      # dependencies and its own CI. It passes locally and fails here.
      - run: bun run test

      - name: Build the npm packages
        run: bun run build:npm

      - name: Build the binaries
        run: bun run build --binaries

      # Real smoke test: the package about to be published has to start on Node,
      # not only on Bun. The shebang already bit us once.
      - name: Built CLI runs on Node
        run: |
          node packages/cli/dist/truo.js --version
          node packages/cli/dist/truo.js vps power --help
          node packages/cli/dist/truo.js auth login --help

      - name: Built SDK imports from Node
        run: |
          cd "$(mktemp -d)"
          echo '{"type":"module"}' > package.json
          cat > check.mjs <<'EOF'
          import { TruoClient, OPERATIONS } from "$GITHUB_WORKSPACE/packages/sdk/dist/index.js";
          if (typeof TruoClient !== "function") throw new Error("TruoClient was not exported");
          if (Object.keys(OPERATIONS).length === 0) throw new Error("OPERATIONS is empty");
          console.log(`SDK ok: ${Object.keys(OPERATIONS).length} operations`);
          EOF
          sed -i "s|\$GITHUB_WORKSPACE|file://$GITHUB_WORKSPACE|" check.mjs
          node check.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          # The package.json files go in because they carry the version already
          # written: the publish job does not run `version:set` again.
          path: |
            packages/*/dist/**
            packages/cli/bin/**
            packages/openapi/openapi/**
            packages/*/package.json
          retention-days: 7

  publish-npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # Provenance: GitHub signs an attestation tying the published tarball to
      # this commit and this workflow. It is what lets anyone verify that
      # `@truocloud/cli` came from this public repo and not from someone's laptop.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      # `path: packages` and not `.`: upload-artifact@v4 trims the common
      # ancestor of all paths (here, `packages/`), so the artifact carries
      # `cli/dist/...` without the prefix. Downloading to `.` leaves the dist
      # OUTSIDE packages/ and npm publishes empty packages without complaining.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # In dependency order. Today all three are self-contained (everything
      # travels bundled), but the ordering is free and stops being free the day
      # one declares another as a real dependency.
      - name: Publish
        run: |
          set -e
          for pkg in packages/openapi packages/sdk packages/cli; do
            echo "── $pkg"
            # The guard exists because it almost happened: without dist, npm
            # publishes a package with only package.json and exits 0.
            ls "$pkg"/dist/*.js >/dev/null || { echo "::error::$pkg has no dist/ — the artifact was not downloaded where the publish expects it"; exit 1; }
            ( cd "$pkg" && npm publish --provenance --access public )
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # `path: packages`: see the comment in publish-npm.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages

      - name: Create the release with the binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            packages/cli/bin/* \
            packages/openapi/openapi/v1.json

  packagers:
    # Brew and scoop point at the release assets: it has to exist first.
    needs: [build, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # At job level so it can be checked in the steps' `if`: a `secrets.` cannot
    # be evaluated directly there.
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      # `path: packages`: see the comment in publish-npm — packagers.ts reads
      # the SHA256SUMS in packages/cli/bin/.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages

      - name: Generate the formula and the manifest
        run: bun scripts/packagers.ts "${{ needs.build.outputs.version }}"

      # Without the PAT the other two repos cannot be written to. Warn and move
      # on: the release is already published, and a stale tap is no reason to
      # mark the workflow red.
      - name: Publish the brew tap and the scoop bucket
        if: ${{ env.TAP_TOKEN != '' }}
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git config --global user.name "truo-release"
          git config --global user.email "dev@truo.cloud"

          push_file() {
            local repo="$1" dest="$2" src="$3"
            local tmp; tmp="$(mktemp -d)"
            git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/truocloud/${repo}.git" "$tmp" || return 0
            mkdir -p "$(dirname "$tmp/$dest")"
            cp "$src" "$tmp/$dest"
            git -C "$tmp" add -A
            git -C "$tmp" diff --cached --quiet && { echo "$repo unchanged"; return 0; }
            git -C "$tmp" commit -m "truo ${VERSION}"
            git -C "$tmp" push
          }

          push_file homebrew-tap Formula/truo.rb dist-packagers/truo.rb
          push_file scoop-bucket bucket/truo.json dist-packagers/truo.json

      - name: Warn if the PAT is missing
        if: ${{ env.TAP_TOKEN == '' }}
        run: |
          echo "::warning::TAP_TOKEN is not configured: the release was published but brew and scoop were not updated."
          echo "Files generated in dist-packagers/ (upload them by hand if needed):"
          ls -la dist-packagers/
