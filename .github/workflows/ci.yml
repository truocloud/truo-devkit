name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Daily: the API can change without anyone touching this repo, and finding out
  # from a client's build is finding out late.
  schedule:
    - cron: "17 6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - run: bun install --frozen-lockfile

      # The committed spec has to be the one the API serves. Without this gate, this copy
      # ages in silence and the published SDK stops describing the published contract.
      - name: Spec is up to date with api.truo.cloud
        run: bun run sync:spec --check

      # Nobody hand-edits a generated file, and nobody updates the spec without regenerating.
      - name: Generated code is up to date with the spec
        run: bun run gen:check

      - run: bun run typecheck

      - run: bun test

      - name: CLI starts and can be built
        run: |
          bun run build
          node packages/cli/dist/truo.js --version
          node packages/cli/dist/truo.js vps power --help

  binaries:
    # Tags only: compiling six targets on every push is expensive and nobody looks at it.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run build --binaries
      - uses: actions/upload-artifact@v4
        with:
          name: truo-binaries
          path: packages/cli/bin/*
