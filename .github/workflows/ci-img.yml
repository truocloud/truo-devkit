name: CI (img)

# The `img/` workspace has its own CI because it has its own release track. Its
# version follows the URL contract, not the OpenAPI spec, and gating a loader fix
# on a spec drift it has nothing to do with would be gating it on nothing.
on:
  push:
    branches: [main]
    paths: ["img/**", ".github/workflows/ci-img.yml"]
  pull_request:
    paths: ["img/**", ".github/workflows/ci-img.yml"]
  # Daily: the URL contract can change without anyone touching this repo, and
  # finding out from a published package is finding out late.
  schedule:
    - cron: "41 6 * * *"

defaults:
  run:
    working-directory: img

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not `latest`. A newer Bun once emitted a bundle whose `export`
      # referenced an undefined symbol and Node refused to parse it.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - run: bun install --frozen-lockfile

      # The vectors are generated by the service from its own parser and signer.
      # Without this gate the local copy ages in silence and every test below
      # keeps verifying yesterday's contract, green.
      - name: Fixtures are up to date with img.truo.cloud
        run: bun run sync:fixtures --check

      - name: Generated name table is up to date with the fixtures
        run: bun run gen:check

      - run: bun run typecheck

      - run: bun test

      # Size budgets are part of the build, and they are enforced rather than
      # reported: this is code that runs in every visitor's browser.
      - run: bun run build

      - name: The built packages import from Node
        run: |
          cd "$(mktemp -d)"
          echo '{"type":"module"}' > package.json
          cat > check.mjs <<'EOF'
          import { buildUrl, parseUrl } from "PKG/index.js";
          import { signUrl } from "PKG/sign.js";
          const url = buildUrl("uploads/a.jpg", { width: 800, format: "auto" }, { pid: "acme" });
          if (url !== "https://img.truo.cloud/i/acme/uploads/a.jpg?f=auto&w=800") {
            throw new Error(`built package produced ${url}`);
          }
          if (parseUrl(url)?.pid !== "acme") throw new Error("parseUrl broke in the built package");
          const signed = await signUrl(url, { secret: "x" });
          if (!signed.includes("&s=")) throw new Error("signUrl broke in the built package");
          console.log("built core ok");
          EOF
          sed -i "s|PKG|file://$GITHUB_WORKSPACE/img/packages/url/dist|g" check.mjs
          node check.mjs

      - name: The built packages require() from CommonJS
        # The reason CJS is built at all: `next.config.js` is still CommonJS in
        # most real projects, so a loader that cannot be require()d is a loader
        # nobody installs.
        run: |
          cd "$(mktemp -d)"
          echo '{}' > package.json
          cat > check.cjs <<'EOF'
          const { buildUrl } = require("PKG/index.cjs");
          if (!buildUrl("a.jpg", { width: 1 }, { pid: "acme" }).includes("/i/acme/")) {
            throw new Error("CJS build is broken");
          }
          console.log("built core ok (cjs)");
          EOF
          sed -i "s|PKG|$GITHUB_WORKSPACE/img/packages/url/dist|g" check.cjs
          node check.cjs

  # A real Next build is the only thing that catches the `loaderFile` contract:
  # the module must default-export a synchronous function, and Next only says so
  # at build time, with an error that does not name which rule was broken.
  next-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Build a fixture Next app and assert the emitted srcset
        run: bun scripts/verify-next.ts
